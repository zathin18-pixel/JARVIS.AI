<!DOCTYPE html>
<html>
<head>
<title>JARVIS AI</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at center, #092338 0%, #03070d 45%, #000 100%);
  color: #00eaff;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow: hidden;
}

.hud {
  padding: 25px 15px;
}

h1 {
  margin: 10px 0;
  font-size: 45px;
  letter-spacing: 10px;
  text-shadow:
    0 0 10px #00eaff,
    0 0 30px #00eaff;
}

.status {
  font-size: 13px;
  letter-spacing: 4px;
  color: #70f7ff;
}

.core {
  position: relative;
  width: 250px;
  height: 250px;
  margin: 55px auto 35px;
  border-radius: 50%;
  border: 2px solid #00eaff;
  box-shadow:
    0 0 15px #00eaff,
    0 0 50px #007bff,
    inset 0 0 40px #006eff;
  animation: rotate 8s linear infinite;
}

.core::before,
.core::after {
  content: "";
  position: absolute;
  inset: 20px;
  border-radius: 50%;
  border: 2px dashed #00eaff;
  animation: rotateReverse 5s linear infinite;
}

.core::after {
  inset: 45px;
  border-style: solid;
  animation: pulse 2s infinite;
}

.energy {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 65px;
  height: 65px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: #00eaff;
  box-shadow:
    0 0 20px #00eaff,
    0 0 60px #00eaff,
    0 0 100px #008cff;
}

.info {
  color: #8bbccc;
  margin: 15px;
}

button {
  margin-top: 20px;
  padding: 16px 35px;
  border: 2px solid #00eaff;
  border-radius: 40px;
  background: rgba(0, 234, 255, 0.05);
  color: #00eaff;
  font-size: 17px;
  letter-spacing: 2px;
  box-shadow: 0 0 20px rgba(0,234,255,.5);
}

button:active {
  background: #00eaff;
  color: #001018;
}

#output {
  min-height: 25px;
  margin-top: 20px;
  color: #d7fbff;
}

@keyframes rotate {
  to { transform: rotate(360deg); }
}

@keyframes rotateReverse {
  to { transform: rotate(-360deg); }
}

@keyframes pulse {
  50% {
    transform: scale(1.15);
    box-shadow: 0 0 30px #00eaff;
  }
}
</style>
</head>

<body>

<div class="hud">

  <div class="status">◉ SYSTEM ONLINE</div>

  <h1>JARVIS</h1>

  <div class="status">PERSONAL AI CORE</div>

  <div class="core">
    <div class="energy"></div>
  </div>

  <div class="info" id="status">
    Awaiting command...
  </div>

  <button onclick="startListening()">
    ACTIVATE JARVIS
  </button>

  <div id="output"></div>

</div>

<script>

const output = document.getElementById("output");
const statusText = document.getElementById("status");

function speak(text) {

  const speech = new SpeechSynthesisUtterance(text);

  speech.rate = 0.9;
  speech.pitch = 0.8;
  speech.volume = 1;

  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(speech);

  output.innerText = text;
}

function startListening() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    speak("Voice recognition is not supported in this browser.");
    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = "en-IN";
  recognition.continuous = false;
  recognition.interimResults = false;

  statusText.innerText = "LISTENING...";

  recognition.start();

  recognition.onresult = function(event) {

    const command =
      event.results[0][0].transcript.toLowerCase();

    output.innerText = "You: " + command;

    statusText.innerText = "PROCESSING...";

    if (command.includes("hello")) {

      speak("Hello. I am JARVIS. Systems are online.");

    } else if (command.includes("time")) {

      const time = new Date().toLocaleTimeString();

      speak("The current time is " + time);

    } else if (command.includes("who are you")) {

      speak("I am JARVIS, your personal artificial intelligence assistant.");

    } else if (command.includes("jarvis")) {

      speak("Yes. I am listening.");

    } else {

      speak("I heard you say " + command +
            ". My advanced intelligence module is not connected yet.");

    }

    statusText.innerText = "SYSTEM ONLINE";
  };

  recognition.onerror = function() {

    statusText.innerText = "MICROPHONE ERROR";

    speak("I could not hear you. Please try again.");

  };

  recognition.onend = function() {

    statusText.innerText = "SYSTEM ONLINE";

  };
}

</script>

</body>
</html>
