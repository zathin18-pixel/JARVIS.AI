<!DOCTYPE html>
<html>
<head>
<title>JARVIS AI</title>

<style>
body {
  margin: 0;
  background: #050912;
  color: #00eaff;
  font-family: Arial, sans-serif;
  text-align: center;
}

.container {
  padding: 40px 20px;
}

h1 {
  font-size: 48px;
  letter-spacing: 8px;
  text-shadow: 0 0 20px #00eaff;
}

.subtitle {
  color: #8aa5b8;
  font-size: 18px;
}

.arc {
  width: 220px;
  height: 220px;
  margin: 50px auto;
  border-radius: 50%;
  border: 3px solid #00eaff;
  box-shadow:
    0 0 20px #00eaff,
    inset 0 0 30px #00eaff;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: pulse 2s infinite;
}

.core {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: #00eaff;
  box-shadow: 0 0 40px #00eaff;
}

button {
  background: transparent;
  color: #00eaff;
  border: 2px solid #00eaff;
  padding: 15px 35px;
  border-radius: 30px;
  font-size: 18px;
  box-shadow: 0 0 15px #00eaff;
}

button:hover {
  background: #00eaff;
  color: #050912;
}

@keyframes pulse {
  50% {
    transform: scale(1.08);
  }
}
</style>
</head>

<body>

<div class="container">

<h1>JARVIS</h1>

<p class="subtitle">PERSONAL ARTIFICIAL INTELLIGENCE</p>

<div class="arc">
  <div class="core"></div>
</div>

<p>SYSTEM ONLINE</p>

<button onclick="activateJarvis()">ACTIVATE JARVIS</button>

</div>

<script>
function activateJarvis() {
  alert("JARVIS ONLINE");
}
</script>

</body>
</html>
