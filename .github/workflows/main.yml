name: Build JARVIS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/jarvis/ai
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "JARVIS"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.jarvis.ai'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.jarvis.ai'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          mkdir -p app/src/main/res/values

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="JARVIS AI"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/jarvis/ai/MainActivity.java <<'EOF'
          package com.jarvis.ai;

          import android.Manifest;
          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.speech.tts.TextToSpeech;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Button;

          import java.util.ArrayList;
          import java.util.Locale;

          public class MainActivity extends Activity {

              private SpeechRecognizer speechRecognizer;
              private TextToSpeech textToSpeech;
              private TextView status;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(Gravity.CENTER);
                  layout.setPadding(40, 40, 40, 40);
                  layout.setBackgroundColor(Color.rgb(5, 10, 18));

                  TextView title = new TextView(this);
                  title.setText("J A R V I S");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(34);
                  title.setGravity(Gravity.CENTER);

                  status = new TextView(this);
                  status.setText("SYSTEM ONLINE");
                  status.setTextColor(Color.CYAN);
                  status.setTextSize(18);
                  status.setGravity(Gravity.CENTER);

                  Button button = new Button(this);
                  button.setText("ACTIVATE JARVIS");
                  button.setTextSize(16);

                  layout.addView(title);
                  layout.addView(status);
                  layout.addView(button);

                  setContentView(layout);

                  textToSpeech = new TextToSpeech(this, result -> {
                      if (result == TextToSpeech.SUCCESS) {
                          textToSpeech.setLanguage(Locale.US);
                      }
                  });

                  button.setOnClickListener(v -> startListening());
              }

              private void startListening() {

                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                          != PackageManager.PERMISSION_GRANTED) {

                      requestPermissions(
                              new String[]{Manifest.permission.RECORD_AUDIO},
                              100);

                      return;
                  }

                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      status.setText("VOICE SERVICE NOT AVAILABLE");
                      speak("Sir, voice recognition is not available.");
                      return;
                  }

                  status.setText("LISTENING, SIR...");

                  speechRecognizer =
                          SpeechRecognizer.createSpeechRecognizer(this);

                  speechRecognizer.setRecognitionListener(
                          new android.speech.RecognitionListener() {

                      @Override
                      public void onReadyForSpeech(Bundle params) {}

                      @Override
                      public void onBeginningOfSpeech() {}

                      @Override
                      public void onRmsChanged(float rmsdB) {}

                      @Override
                      public void onBufferReceived(byte[] buffer) {}

                      @Override
                      public void onEndOfSpeech() {
                          status.setText("PROCESSING...");
                      }

                      @Override
                      public void onError(int error) {
                          status.setText("READY");
                          speak("Sorry sir, I did not hear you.");
                      }

                      @Override
                      public void onResults(Bundle results) {

                          ArrayList<String> matches =
                                  results.getStringArrayList(
                                          SpeechRecognizer.RESULTS_RECOGNITION);

                          if (matches != null && !matches.isEmpty()) {

                              String command = matches.get(0);

                              status.setText(command);

                              respond(command);
                          }
                      }

                      @Override
                      public void onPartialResults(Bundle partialResults) {}

                      @Override
                      public void onEvent(int eventType, Bundle params) {}
                  });

                  Intent intent =
                          new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);

                  intent.putExtra(
                          RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                          RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);

                  intent.putExtra(
                          RecognizerIntent.EXTRA_LANGUAGE,
                          Locale.getDefault());

                  intent.putExtra(
                          RecognizerIntent.EXTRA_PROMPT,
                          "Listening, sir");

                  speechRecognizer.startListening(intent);
              }

              private void respond(String command) {

                  command = command.toLowerCase(Locale.getDefault());

                  if (command.contains("hello") ||
                          command.contains("hi")) {

                      speak("Hello sir. JARVIS is online and ready.");

                  } else if (command.contains("who are you")) {

                      speak("I am JARVIS, your personal AI assistant, sir.");

                  } else {

                      speak("I heard you, sir. I am ready for your command.");
                  }
              }

              private void speak(String message) {

                  if (textToSpeech != null) {

                      textToSpeech.speak(
                              message,
                              TextToSpeech.QUEUE_FLUSH,
                              null,
                              "JARVIS_RESPONSE");
                  }
              }

              @Override
              protected void onDestroy() {

                  if (speechRecognizer != null) {
                      speechRecognizer.destroy();
                  }

                  if (textToSpeech != null) {
                      textToSpeech.stop();
                      textToSpeech.shutdown();
                  }

                  super.onDestroy();
              }
          }
          EOF

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip

      - name: Build APK
        run: |
          ./gradle-8.9/bin/gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
